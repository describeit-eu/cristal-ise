databaseChangeLog:
  - changeSet:
      id: "003-create-collection-member"
      author: "kovax"
      changes:
        - createTable:
            tableName: collection_member
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: child_item
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: properties
                  type: jsonb
                  constraints:
                    nullable: true
              - column:
                  name: collection_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: collection_id
            baseTableName: collection_member
            constraintName: fk_collection_member_collection
            referencedColumnNames: id
            referencedTableName: collection
