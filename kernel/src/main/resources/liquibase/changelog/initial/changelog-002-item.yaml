databaseChangeLog:
  - changeSet:
      id: "001-create-item"
      author: "kovax"
      changes:
        - createTable:
            tableName: item
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: action_id
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseColumnNames: action_id
            baseTableName: item
            constraintName: fk_action_item
            referencedColumnNames: id
            referencedTableName: action
            onDelete: NO ACTION
