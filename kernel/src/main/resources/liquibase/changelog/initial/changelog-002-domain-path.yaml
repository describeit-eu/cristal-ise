databaseChangeLog:
  - changeSet:
      id: "002-create-domain-path"
      author: "kovax"
      changes:
        - createTable:
            tableName: domain_path
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: path
                  type: ltree
                  constraints:
                    nullable: false
              - column:
                  name: item_id
                  type: uuid
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseColumnNames: item_id
            baseTableName: domain_path
            constraintName: fk_domainPath_item
            referencedColumnNames: id
            referencedTableName: item
            onDelete: CASCADE
        - sql:
            sql: "CREATE INDEX path_gist_idx ON domain_path USING GIST (path);"
        - sql:
            sql: "CREATE INDEX path_idx ON domain_path USING BTREE (path);"
        - sql:
            sql: "CREATE INDEX path_hash_idx ON domain_path USING HASH (path);"
