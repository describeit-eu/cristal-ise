databaseChangeLog:
  - changeSet:
      id: "003-create-collection"
      author: "kovax"
      changes:
        - createTable:
            tableName: collection
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: properties
                  type: jsonb
                  constraints:
                    nullable: true
              - column:
                  name: item_id
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: item_id
            baseTableName: collection
            constraintName: fk_collection_item
            referencedColumnNames: id
            referencedTableName: item
