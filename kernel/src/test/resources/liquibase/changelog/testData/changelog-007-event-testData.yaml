databaseChangeLog:
  - changeSet:
      id: "006-event-testData"
      author: "kovax"
      context: "event"
      changes:
        - loadData:
            file: data/07-event.csv
            separator: ";"
            tableName: event
            encoding: UTF-8
            nullValue: NULL
            columns:
              - column:
                  name: item_id
                  type: uuid
              - column:
                  name: item_version
                  type: string
              - column:
                  name: action_desc
                  type: uuid
              - column:
                  name: action_version
                  type: string
              - column:
                  name: action_path
                  type: string
              - column:
                  name: transition_name
                  type: string
              - column:
                  name: script
                  type: uuid
              - column:
                  name: script_version
                  type: string
              - column:
                  name: state_machine_desc
                  type: uuid
              - column:
                  name: state_machine_version
                  type: string
              - column:
                  name: user_login
                  type: string
              - column:
                  name: timestamp
                  type: timestamp
              - column:
                  name: action_properties
                  type: string
