databaseChangeLog:
  - changeSet:
      id: "003-collection-testData"
      author: "kovax"
      context: "collection"
      changes:
        - loadData:
            file: data/03-collections.csv
            separator: ";"
            tableName: collection
            encoding: UTF-8
            nullValue: NULL
            columns:
              - column:
                  name: item_id
                  type: uuid
              - column:
                  name: name
                  type: string
              - column:
                  name: version
                  type: string
              - column:
                  name: properties
                  type: string
