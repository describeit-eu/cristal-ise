databaseChangeLog:
  - changeSet:
      id: "005-job-testData"
      author: "kovax"
      context: "job"
      changes:
        - loadData:
            file: data/05-job.csv
            separator: ";"
            tableName: job
            encoding: UTF-8
            nullValue: NULL
            columns:
              - column:
                  name: item_id
                  type: uuid
              - column:
                  name: action_path
                  type: string
              - column:
                  name: transition
                  type: string
