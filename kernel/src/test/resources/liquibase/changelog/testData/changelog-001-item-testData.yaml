databaseChangeLog:
  - changeSet:
      id: "001-item-testData"
      author: "kovax"
      context: "item"
      changes:
        - loadData:
            file: data/item.csv
            separator: ";"
            tableName: item
            encoding: UTF-8
            columns:
              - column:
                  name: id
                  type: bigint
              - column:
                  name: uuid
                  type: uuid
              - column:
                  name: name
                  type: string
              - column:
                  name: version
                  type: string
